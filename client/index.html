<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#070a11" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Eco Nera</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        background: #070a11;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #dfe6f5;
        /* Margini di sicurezza del telefono (foro fotocamera, angoli stondati,
           barra dei gesti): li legge input.js per non metterci sotto i
           pulsanti, dove il dito non li prenderebbe mai. */
        --sar: env(safe-area-inset-right, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
      }
      #wrap { position: relative; width: 100vw; height: 100vh; height: 100dvh; }
      /* Le schermate a tutto schermo: menu, guida e collegamento.
         Sono pensate per uno schermo BASSO — il gioco e' bloccato in
         orizzontale, quindi in verticale ci sono si e no 360 punti, e una
         scheda alta manda i nomi sotto il bordo. */
      #apriPausa {
        position: absolute;
        top: calc(6px + env(safe-area-inset-top, 0px));
        right: calc(6px + env(safe-area-inset-right, 0px));
        width: 38px; height: 38px;
        border: 0; border-radius: 9px;
        background: rgba(12,16,23,0.72); color: #98a3bd;
        font-size: 17px; line-height: 1; cursor: pointer;
      }
      #apriPausa[hidden] { display: none; }

      /* Il briefing: cosa si va a fare, con il disegno accanto. Sta su uno
         schermo basso e largo, quindi testo a sinistra e figura a destra. */
      #briefing {
        position: absolute;
        inset: 0;
        background: rgba(5,7,12,0.96);
        display: flex; align-items: center; justify-content: center;
        padding: calc(10px + env(safe-area-inset-top, 0px))
                 calc(14px + env(safe-area-inset-right, 0px))
                 calc(10px + env(safe-area-inset-bottom, 0px))
                 calc(14px + env(safe-area-inset-left, 0px));
      }
      #briefing[hidden] { display: none; }
      #briefingDentro {
        display: flex; gap: 18px; align-items: center;
        max-width: 760px; width: 100%;
      }
      #briefingTesti { flex: 1 1 0; min-width: 0; }
      .etichetta {
        font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
        color: #78849f;
      }
      #briefingTitolo { font-size: 23px; font-weight: 600; margin: 2px 0 6px; }
      #briefingTesto { font-size: 12.5px; line-height: 1.5; color: #c3cbde; }
      #briefingDisegno {
        display: block; width: 300px; height: 190px; flex: none;
        background: #080c14; border: 1px solid #1c2434; border-radius: 10px;
      }
      #briefingConto { font-size: 12px; color: #78849f; }
      @media (max-width: 620px) {
        #briefingDentro { flex-direction: column; gap: 10px; }
        #briefingDisegno { width: 260px; height: 150px; }
      }
      @media (max-height: 380px) {
        #briefingDisegno { width: 230px; height: 150px; }
        #briefingTitolo { font-size: 19px; }
      }

      /* La stanza: quattro cifre e un pulsante, su una riga sola. Prima era
         una schermata a parte con dei passi; era una procedura per una cosa
         che e' un numero. */
      #rigaStanza { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
      #rigaStanza[hidden] { display: none; }
      #campoStanza {
        font: 700 26px ui-monospace, Consolas, monospace;
        letter-spacing: 0.3em; text-align: center; text-indent: 0.3em;
        width: 150px; flex: none; padding: 6px 4px;
        background: #0c1017; color: #dfe6f5;
        border: 1px solid #2a3550; border-radius: 10px;
      }
      #entraStanza {
        font: inherit; font-size: 14px; font-weight: 600;
        padding: 10px 18px; border: 0; border-radius: 9px;
        background: #1b2434; color: #dfe6f5; cursor: pointer;
      }
      #entraStanza:disabled { color: #6a7590; cursor: default; }
      #statoStanza { font-size: 12px; min-height: 17px; margin-top: 6px; color: #ffc65c; }
      /* L'indirizzo del servizio non si vede mai, finche' non serve: compare
         solo se il servizio non risponde, che e' l'unico momento in cui uno
         ha motivo di cambiarlo. */
      #rigaServizio { margin-top: 8px; font-size: 11px; color: #5c6780; display: block; }
      #rigaServizio[hidden] { display: none; }
      #rigaServizio input {
        font: 11px ui-monospace, Consolas, monospace; width: 100%; max-width: 340px;
        background: #0c1017; color: #98a3bd;
        border: 1px solid #1c2434; border-radius: 6px; padding: 5px 7px; margin-top: 3px;
      }

      #menu, #guida, #collegamento, #fine, #pausa {
        position: absolute;
        inset: 0;
        background: #05070c;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: calc(10px + env(safe-area-inset-top, 0px))
                 calc(14px + env(safe-area-inset-right, 0px))
                 calc(10px + env(safe-area-inset-bottom, 0px))
                 calc(14px + env(safe-area-inset-left, 0px));
      }
      #menu[hidden], #guida[hidden], #fine[hidden], #pausa[hidden] { display: none; }
      #pausa { display: flex; align-items: center; justify-content: center;
               background: rgba(5,7,12,0.93); }
      #pausaDentro { text-align: center; }
      #pausaDentro h1 { font-size: 22px; letter-spacing: 0.05em; }
      .avvisoPausa { color: #98a3bd; font-size: 12px; margin: 6px 0 14px; }
      #pausaDentro .pulsantiera { justify-content: center; }
      #fine { display: flex; align-items: center; justify-content: center; }
      #fineDentro { text-align: center; max-width: 460px; }
      #fineDentro h1 { font-size: 24px; color: #ff5d5d; letter-spacing: 0.05em; }
      /* Vinta si legge in giallo, persa in rosso: il colore lo dice prima
         delle parole, e a fine partita le parole si leggono dopo. */
      #fineDentro h1.vinta { color: #ffc65c; }
      #fineDettaglio { color: #c3cbde; font-size: 13px; margin: 8px 0 16px; line-height: 1.5; }
      #tornaAlMenu {
        font: inherit; font-size: 15px; font-weight: 600;
        padding: 10px 24px; border: 0; border-radius: 9px;
        background: #ffc65c; color: #05070c; cursor: pointer;
      }
      .compagnia {
        display: flex; align-items: center; gap: 8px;
        margin-top: 10px; font-size: 12px; color: #98a3bd; cursor: pointer;
      }
      .compagnia input { width: 18px; height: 18px; accent-color: #ffc65c; }

      /* Come sta il server, sotto le spunte e sopra il pulsante: si legge
         proprio mentre si sta per premere Entra. Si tocca per cambiare
         indirizzo. */
      .rigaServer {
        display: block; margin-top: 8px; padding: 0;
        background: none; border: 0; font: inherit; font-size: 12px;
        color: #98a3bd; text-align: left; cursor: pointer;
      }
      .rigaServer[hidden] { display: none; }
      .rigaServer.guasto { color: #ffa03c; }

      #guidaDentro { max-width: 900px; margin: 0 auto; }
      #guidaDentro h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.05em; }
      .sottotitolo { color: #78849f; font-size: 12px; margin: 3px 0 10px; }

      /* Le scelte a sinistra, la figura a destra, e in fondo a destra le cose
         che si guardano di rado: versione, guida, lingua. */
      #menuDentro {
        max-width: 1020px; margin: 0 auto;
        min-height: 100%; display: flex; flex-direction: column;
      }
      #menuColonne { display: flex; gap: 22px; align-items: flex-start; }
      #menuScelte { flex: 1 1 0; min-width: 0; }
      #menuFigura { flex: 0 1 400px; min-width: 0; }
      #menuFigura svg {
        display: block; width: 100%; height: auto;
        border: 1px solid #1c2434; border-radius: 12px;
      }
      .etichettaScelta {
        font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
        color: #78849f; margin: 0 0 6px;
      }
      #classi { margin-bottom: 16px; }
      #modi { display: flex; gap: 8px; }
      #etichettaDifficolta { margin-top: 14px; }
      #difficolta { display: flex; gap: 6px; }
      #difficolta .modo { font-size: 12px; padding: 7px 4px; }
      #difficolta.spenta { opacity: 0.45; pointer-events: none; }
      .modo {
        flex: 1 1 0; min-width: 0;
        background: #0c1017; border: 2px solid #232d41; border-radius: 10px;
        padding: 10px 6px; color: #dfe6f5; font: inherit; font-size: 13px;
        cursor: pointer; text-align: center;
      }
      .modo[aria-pressed='true'] { border-color: #ffc65c; background: #141c2a; color: #ffc65c; }
      #avvio.grande {
        display: block; width: 100%; margin-top: 14px;
        font: inherit; font-size: 16px; font-weight: 700;
        padding: 12px 20px; border: 0; border-radius: 9px;
        background: #ffc65c; color: #05070c; cursor: pointer;
      }
      #avvio.grande:disabled { background: #2a3550; color: #6a7590; cursor: default; }
      #menuPiede {
        margin-top: auto; padding-top: 16px;
        display: flex; justify-content: flex-end; align-items: center; gap: 12px;
        font-size: 11px; color: #5c6780;
      }
      #menuPiede select {
        font: inherit; font-size: 12px; padding: 6px 8px;
        background: #0c1017; color: #98a3bd;
        border: 1px solid #232d41; border-radius: 8px;
      }
      #menuPiede button {
        font: inherit; font-size: 13px; font-weight: 600;
        padding: 7px 14px; border: 0; border-radius: 8px;
        background: #1b2434; color: #dfe6f5; cursor: pointer;
      }

      /* Le tre classi in fila, ognuna con la figura accanto al nome. */
      #classi { display: flex; gap: 8px; align-items: stretch; }
      .classe {
        flex: 1 1 0;
        min-width: 0;
        text-align: left;
        background: #0c1017;
        border: 2px solid #232d41;
        border-radius: 10px;
        padding: 8px 10px;
        color: #dfe6f5;
        font: inherit;
        cursor: pointer;
      }
      .classe[aria-pressed='true'] { border-color: currentColor; background: #141c2a; }
      .intestazione { display: flex; align-items: center; gap: 8px; }
      /* Misura fissa: senza, la regola del gioco la stirava a tutta scheda. */
      .classe canvas { display: block; width: 44px; height: 34px; flex: none; }
      .classe .nome { font-size: 15px; font-weight: 600; line-height: 1.1; }
      .classe .arma { font-size: 10px; opacity: 0.8; }
      .classe .desc { font-size: 11px; color: #98a3bd; margin-top: 6px; line-height: 1.35; }
      .classe .abilita { font-size: 11px; margin-top: 5px; color: currentColor; }

      .pulsantiera { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
      .pulsantiera button, #chiudiGuida {
        font: inherit; font-size: 15px; font-weight: 600;
        padding: 9px 20px; border: 0; border-radius: 9px;
        background: #ffc65c; color: #05070c; cursor: pointer;
      }
      .pulsantiera button:disabled { background: #2a3550; color: #6a7590; cursor: default; }
      .pulsantiera .secondario { background: #1b2434; color: #dfe6f5; }

      #guidaDentro h2 { font-size: 14px; margin: 12px 0 4px; color: #ffc65c; }
      #guidaDentro p, #guidaDentro li { font-size: 12px; line-height: 1.5; color: #c3cbde; }
      #guidaDentro ul { margin-left: 16px; }
      #guidaDentro b { color: #dfe6f5; }
      #chiudiGuida { margin-top: 14px; }

      /* Schermo davvero basso (telefono in orizzontale): si stringe tutto e
         le descrizioni lunghe spariscono, tanto ci sono nella guida. */
      @media (max-height: 420px) {
        .classe .desc { display: none; }
        .classe canvas { width: 38px; height: 30px; }
        #menuFigura { flex-basis: 300px; }
        #avvio.grande { margin-top: 10px; padding: 10px 20px; }
        #menuPiede { padding-top: 10px; }
      }

      /* Schermo stretto: la figura se ne va prima delle scelte — e' bella, non
         serve. Poi le schede vanno in colonna invece di schiacciarsi. */
      @media (max-width: 760px) {
        #menuFigura { display: none; }
      }
      @media (max-width: 520px) {
        #classi { flex-direction: column; }
        #modi { flex-wrap: wrap; }
        #campoStanza { width: 120px; font-size: 22px; }
      }

      #collegamento { display: flex; align-items: center; justify-content: center; }
      #collegamento[hidden] { display: none; }
      #modulo {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: min(340px, 100%);
      }
      #modulo h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.04em; }
      #modulo p { font-size: 13px; color: #78849f; }
      #modulo input, #modulo button {
        font: inherit;
        font-size: 16px; /* sotto i 16 px i telefoni zoomano da soli */
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid #2a3550;
      }
      #modulo input { background: #0c1017; color: #dfe6f5; }
      #modulo button { background: #ffc65c; color: #05070c; border: 0; font-weight: 600; }
      #modulo button.secondario { background: #1b2434; color: #dfe6f5; }
      #modulo small { color: #ff5d5d; min-height: 16px; font-size: 12px; }

      /* Solo la tela del gioco: prima questa regola prendeva anche le
         anteprime del menu e le stirava a tutta scheda. */
      #gioco {
        display: block;
        width: 100%;
        height: 100%;
        /* il dito comanda il gioco, non fa scorrere né zoomare la pagina */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="gioco"></canvas>
      <!-- Il solo pezzo di interfaccia in HTML sopra al gioco: un pulsante
           piccolo in alto a destra, lontano dai pollici. -->
      <button id="apriPausa" type="button" hidden aria-label="Menu">☰</button>
    </div>

    <!-- Il menu: si sceglie la classe e si parte. Sta in HTML e non nel
         canvas perche' un elenco di schede con del testo lo sa fare meglio il
         browser, e su un telefono i tocchi li gestisce gia' lui. -->
    <div id="menu" hidden>
      <div id="menuDentro">
        <div id="menuColonne">
          <div id="menuScelte">
            <p class="etichettaScelta" data-t="menu.scegliClasse"></p>
            <div id="classi"></div>

            <p class="etichettaScelta" data-t="menu.scegliModo"></p>
            <div id="modi"></div>

            <p class="etichettaScelta" id="etichettaDifficolta"></p>
            <div id="difficolta"></div>

            <!-- Solo per il duo online: quattro cifre uguali per tutti e due,
                 e il primo che entra ospita. Sta qui e non in un pannello a
                 parte perche' e' una riga, non una procedura. -->
            <div id="rigaStanza" hidden>
              <input id="campoStanza" type="text" inputmode="numeric" autocomplete="off"
                     maxlength="5" placeholder="0000" />
              <button id="entraStanza" type="button" data-t="menu.collega"></button>
            </div>
            <p id="statoStanza"></p>
            <label id="rigaServizio" hidden>
              <span data-t="invito.servizio"></span>
              <input id="campoServizio" type="text" inputmode="url" autocomplete="off"
                     autocapitalize="off" spellcheck="false"
                     placeholder="https://....vercel.app" />
            </label>

            <button id="statoServer" type="button" class="rigaServer" hidden></button>
            <p id="controller" class="avvisoPausa" hidden></p>

            <button id="avvio" type="button" class="grande" data-t="menu.entra" disabled></button>
          </div>

          <!-- Il gioco in una figura: una pianta vista dall'alto di cui si
               vede solo quello che le due torce illuminano. E' il gioco. -->
          <div id="menuFigura">
            <svg viewBox="0 0 400 250" role="img" aria-labelledby="figuraTitolo">
              <title id="figuraTitolo">Eco Nera</title>
              <defs>
                <radialGradient id="luceFaro" cx="20%" cy="76%" r="82%">
                  <stop offset="0%" stop-color="#ffc65c" stop-opacity="0.42" />
                  <stop offset="55%" stop-color="#ffc65c" stop-opacity="0.13" />
                  <stop offset="100%" stop-color="#ffc65c" stop-opacity="0" />
                </radialGradient>
                <radialGradient id="luceEco" cx="37%" cy="80%" r="86%">
                  <stop offset="0%" stop-color="#4ecdc4" stop-opacity="0.34" />
                  <stop offset="55%" stop-color="#4ecdc4" stop-opacity="0.11" />
                  <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0" />
                </radialGradient>
                <!-- Il cuore del disegno: la pianta esiste tutta, ma si vede
                     solo dove arriva la luce. Come nel gioco. -->
                <mask id="soloDoveIlluminano">
                  <path d="M 80 190 L 97 92 A 100 100 0 0 1 178 207 Z" fill="#fff" />
                  <path d="M 150 200 L 328 89 A 210 210 0 0 1 358 171 Z" fill="#fff" />
                </mask>
              </defs>

              <rect width="400" height="250" fill="#05070c" />

              <g mask="url(#soloDoveIlluminano)">
                <rect x="30" y="60" width="150" height="120" fill="#1d2637" />
                <rect x="196" y="40" width="120" height="90" fill="#1d2637" />
                <rect x="196" y="146" width="170" height="80" fill="#1d2637" />
                <rect x="180" y="96" width="16" height="26" fill="#8a6a3a" />
                <rect x="180" y="160" width="16" height="26" fill="#8a6a3a" />
                <g stroke="#313d5c" stroke-width="3" fill="none">
                  <rect x="30" y="60" width="150" height="120" />
                  <rect x="196" y="40" width="120" height="90" />
                  <rect x="196" y="146" width="170" height="80" />
                </g>
                <g stroke="#232d41" stroke-width="1">
                  <path d="M80 60V180M130 60V180M246 40v90M296 40v90M256 146v80M316 146v80" />
                </g>
              </g>

              <path d="M 80 190 L 97 92 A 100 100 0 0 1 178 207 Z" fill="url(#luceFaro)" />
              <path d="M 150 200 L 328 89 A 210 210 0 0 1 358 171 Z" fill="url(#luceEco)" />

              <!-- I nemici: quelli dentro la luce si vedono, quello fuori e'
                   un ricordo appena accennato. Sapere che c'e' e non vederlo
                   e' meta' del gioco. -->
              <circle cx="141" cy="118" r="6" fill="#e05a5a" />
              <circle cx="288" cy="131" r="6" fill="#e05a5a" />
              <circle cx="252" cy="196" r="5.5" fill="#e05a5a" opacity="0.85" />
              <circle cx="60" cy="96" r="6" fill="#e05a5a" opacity="0.16" />

              <!-- I due giocatori. -->
              <circle cx="80" cy="190" r="8" fill="#ffc65c" />
              <circle cx="150" cy="200" r="8" fill="#4ecdc4" />

              <text x="200" y="240" text-anchor="middle"
                    font-family="ui-monospace, Consolas, monospace"
                    font-size="17" font-weight="700" letter-spacing="7"
                    fill="#dfe6f5" opacity="0.72">ECO NERA</text>
            </svg>
          </div>
        </div>

        <div id="menuPiede">
          <span id="rigaVersione"></span>
          <button id="apriGuida" type="button" class="secondario" data-t="menu.guida"></button>
          <select id="lingua"></select>
        </div>
      </div>
    </div>

    <!-- Prima di ogni missione: cosa c'e' da fare, scritto e disegnato. Per
         questi secondi il settore resta addormentato. -->
    <div id="briefing" hidden>
      <div id="briefingDentro">
        <div id="briefingTesti">
          <div class="etichetta" id="briefingSettore"></div>
          <h1 id="briefingTitolo"></h1>
          <p id="briefingTesto"></p>
          <div class="pulsantiera">
            <button id="briefingVai" type="button" data-t="briefing.vai"></button>
            <span id="briefingConto"></span>
          </div>
        </div>
        <canvas id="briefingDisegno"></canvas>
      </div>
    </div>

    <div id="pausa" hidden>
      <div id="pausaDentro">
        <h1 data-t="pausa.titolo"></h1>
        <p class="avvisoPausa" data-t="pausa.avviso"></p>
        <div class="pulsantiera">
          <button id="riprendi" type="button" data-t="pausa.riprendi"></button>
          <button id="esciAlMenu" type="button" class="secondario" data-t="pausa.esci"></button>
        </div>
      </div>
    </div>

    <div id="fine" hidden>
      <div id="fineDentro">
        <h1></h1>
        <p id="fineDettaglio"></p>
        <p id="avvisoVersione" class="avvisoPausa" hidden></p>
        <button id="tornaAlMenu" type="button" data-t="fine.torna"></button>
      </div>
    </div>

    <div id="guida" hidden>
      <div id="guidaDentro">
        <h1 data-t="guida.titolo"></h1>

        <h2 data-t="guida.buio.titolo"></h2>
        <p data-t="guida.buio.testo"></p>

        <h2 data-t="guida.comandi.titolo"></h2>
        <ul>
          <li data-t="guida.comandi.muovere"></li>
          <li data-t="guida.comandi.sparare"></li>
          <li data-t="guida.comandi.torcia"></li>
          <li data-t="guida.comandi.abilita"></li>
        </ul>

        <h2 data-t="guida.rumore.titolo"></h2>
        <p data-t="guida.rumore.testo"></p>

        <h2 data-t="guida.terra.titolo"></h2>
        <p data-t="guida.terra.testo"></p>

        <h2 data-t="guida.rifornimenti.titolo"></h2>
        <p data-t="guida.rifornimenti.testo"></p>

        <h2 data-t="guida.riparo.titolo"></h2>
        <p data-t="guida.riparo.testo"></p>

        <h2 data-t="guida.controller.titolo"></h2>
        <p data-t="guida.controller.testo"></p>

        <h2 data-t="guida.invito.titolo"></h2>
        <p data-t="guida.invito.testo"></p>

        <h2 data-t="guida.offline.titolo"></h2>
        <p data-t="guida.offline.testo"></p>

        <h2 data-t="guida.modalita.titolo"></h2>
        <ul>
          <li data-t="guida.modalita.sabotaggio"></li>
          <li data-t="guida.modalita.bomba"></li>
          <li data-t="guida.modalita.dominio"></li>
        </ul>

        <h2 data-t="guida.spedizione.titolo"></h2>
        <p data-t="guida.spedizione.testo"></p>

        <button id="chiudiGuida" type="button" data-t="guida.chiudi"></button>
      </div>
    </div>

    <!-- Serve solo dentro l'app: nel browser l'indirizzo del server e' quello
         della pagina, nell'APK non c'e' niente da cui dedurlo. -->
    <div id="collegamento" hidden>
      <form id="modulo">
        <h1>Eco Nera</h1>
        <p data-t="server.istruzione"></p>
        <input
          id="indirizzo"
          type="text"
          inputmode="url"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          placeholder="192.168.2.46:5190"
        />
        <button type="submit" data-t="server.collega"></button>
        <button id="senzaServer" type="button" class="secondario" data-t="server.senza"></button>
        <small id="nota"></small>
      </form>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
